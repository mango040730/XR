name: Deploy XR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /XR/
      VITE_STATIC_HOST: github-pages
      VITE_SOCIAL_SERVER_URL: ${{ vars.SOCIAL_SERVER_URL }}
    steps:
      - name: Check out current source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify configured real-time server
        if: env.VITE_SOCIAL_SERVER_URL != ''
        run: npm run verify:social -- "$VITE_SOCIAL_SERVER_URL"
      - name: Validate and build current project
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
